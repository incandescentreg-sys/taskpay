<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>err diag</title>
</head>
<body>
  <div id="app"></div>
  <div id="result" style="white-space:pre-wrap;font-family:monospace;font-size:13px;padding:10px;background:#111;color:#f66"></div>
  <script>
    window.__errs = [];
    window.onerror = function (msg, src, line, col, err) {
      window.__errs.push((src ? src.split('/').pop() : '') + ':' + line + ' ' + msg + ' | ' + (err && err.stack ? err.stack.split('\n').slice(0,3).join(' -> ') : ''));
    };
    window.addEventListener('unhandledrejection', function (e) {
      window.__errs.push('PROMISE: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
  </script>
  <script>
    if (!window.Telegram || !window.Telegram.WebApp) {
      window.Telegram = { WebApp: {
        ready(){}, expand(){}, initDataUnsafe:{}, setHeaderColor(){}, setBackgroundColor(){},
        disableVerticalSwipes(){}, HapticFeedback:{ impactOccurred(){} },
        BackButton:{ show(){}, hide(){}, onClick(){} },
        showConfirm(m){ return Promise.resolve(true); }, showAlert(){}
      }};
    }
  </script>
  <script src="../js/vendor/supabase.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/screens.js"></script>
  <script>
    setTimeout(function () {
      document.getElementById('result').textContent =
        'ERR count: ' + window.__errs.length + '\n' + window.__errs.join('\n\n') +
        '\n\n#app len: ' + document.getElementById('app').innerHTML.length;
    }, 1500);
  </script>
</body>
</html>
