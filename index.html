<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#001020">
  <title>Yumitask — биржа заданий</title>
  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="icon" href="logo.jpg" type="image/jpeg">
</head>
<body>
  <!-- Анимированные серые волны на фоне -->
  <div class="bg-waves" aria-hidden="true">
    <div class="wave-row wave-1">
      <svg viewBox="0 0 1440 320" preserveAspectRatio="none"><path d="M0,120 C180,44 360,44 540,120 C720,196 900,196 1080,120 C1240,64 1360,86 1440,120 L1440,320 L0,320 Z"/></svg>
      <svg viewBox="0 0 1440 320" preserveAspectRatio="none"><path d="M0,120 C180,44 360,44 540,120 C720,196 900,196 1080,120 C1240,64 1360,86 1440,120 L1440,320 L0,320 Z"/></svg>
    </div>
    <div class="wave-row wave-2">
      <svg viewBox="0 0 1440 320" preserveAspectRatio="none"><path d="M0,120 C180,44 360,44 540,120 C720,196 900,196 1080,120 C1240,64 1360,86 1440,120 L1440,320 L0,320 Z"/></svg>
      <svg viewBox="0 0 1440 320" preserveAspectRatio="none"><path d="M0,120 C180,44 360,44 540,120 C720,196 900,196 1080,120 C1240,64 1360,86 1440,120 L1440,320 L0,320 Z"/></svg>
    </div>
    <div class="wave-row wave-3">
      <svg viewBox="0 0 1440 320" preserveAspectRatio="none"><path d="M0,120 C180,44 360,44 540,120 C720,196 900,196 1080,120 C1240,64 1360,86 1440,120 L1440,320 L0,320 Z"/></svg>
      <svg viewBox="0 0 1440 320" preserveAspectRatio="none"><path d="M0,120 C180,44 360,44 540,120 C720,196 900,196 1080,120 C1240,64 1360,86 1440,120 L1440,320 L0,320 Z"/></svg>
    </div>
  </div>

  <div id="app"></div>

  <!-- SDK Telegram WebApp (офлайн-фолбэк ниже) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    if (!window.Telegram || !window.Telegram.WebApp) {
      window.Telegram = {
        WebApp: {
          ready: function () {},
          expand: function () {},
          initDataUnsafe: {},
          HapticFeedback: { impactOccurred: function () {} },
          BackButton: { show: function () {}, hide: function () {}, onClick: function () {} },
          showConfirm: function (m, ok, no) { return Promise.resolve(window.confirm(m || '')); },
          showAlert: function (m) { window.alert(m || ''); return Promise.resolve(); }
        }
      };
    }
  </script>
  <script src="js/store.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
  <script src="js/screens.js?v=2"></script>
</body>
</html>
